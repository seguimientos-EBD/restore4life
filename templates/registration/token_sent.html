{% extends 'base.html' %}
{% load static %}

{% block title %}Check your inbox — Restore4Life{% endblock %}

{% block content %}
<div class="row text-center">
    <div class="col-lg-5 mx-auto">
        <img class="my-4 img-fluid" style="max-width: 110px;" src="{% static 'img/restore4life_mark.png' %}" alt="">
        <div class="alert alert-success" role="alert">
            We have sent a sign-in link to <strong>{{ email }}</strong>.
            Check your inbox (and your spam folder) to continue.
        </div>
        <a href="{% url 'login' %}">Back</a>
    </div>
</div>
{% endblock %}
