{% extends 'base.html' %}
{% load static django_bootstrap5 hidroperiodo %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0">{{ ambito.nombre }}</h2>
    <a href="{% url 'index' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

{# Arriba los mandos del cálculo (a dos columnas), abajo el mapa a todo lo ancho. #}
<div class="mb-3">
    {% panel_hidroperiodo ambito %}
</div>

<div class="ambito-mapa border rounded" style="height: 60vh;" data-geojson-url="{% url 'ambitos:geojson' ambito.pk %}"></div>

<div class="hidroperiodo-capa card mt-2 d-none">
    <div class="card-body py-2 d-flex align-items-center gap-3 flex-wrap">
        <strong class="small js-nombre"></strong>
        <div class="js-leyenda flex-grow-1" style="min-width: 12rem;"></div>
        <label class="small text-muted mb-0">Opacidad
            <input type="range" class="form-range js-opacidad align-middle" style="width: 6rem;"
                   min="0" max="1" step="0.05" value="0.8">
        </label>
        <button type="button" class="btn btn-sm btn-outline-secondary js-quitar-capa">Quitar</button>
    </div>
</div>
{% endblock %}
