[project]
name = "Restore4Life"
version = "0.1.0"
description = ""
authors = [
    { name = "Pablo Flores", email = "pablo.flores@ebd.csic.es" },
    { name = "Diego García", email = "diegogarcia@ebd.csic.es" },
]
requires-python = ">=3.13"
readme = "README.md"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "django (>=5.2.0,<6.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "django-sass-processor (>=1.4.2,<2.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "django-bootstrap5 (>=26.2,<27.0)",
    "libsass (>=0.23.0,<0.24.0)",
    "django-yarnpkg (>=6.1.3,<7.0.0)",
    "ndvi2gif (>=1.2.2,<2.0.0)",
    "geemap (>=0.37.3,<0.38.0)",
    "ipyevents (>=2.0.4,<3.0.0)",
    "geopandas (>=1.1.3,<2.0.0)",
    "jupyterlab (>=4.5.7,<5.0.0)",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]

